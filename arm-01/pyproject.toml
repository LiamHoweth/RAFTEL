[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raftel-arm01"
version = "0.1.0"
description = "Hardware-free logical sorting prototype for RAFTEL ARM-01"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.4"]

[project.scripts]
raftel-sort = "raftel_arm01.cli:main"
raftel-evaluate = "raftel_arm01.evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raftel_arm01 = ["defaults.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
