name: ARM-01 software
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned development dependencies
        run: >-
          python -m pip install --only-binary :all:
          -r arm-01/requirements-dev.lock -e 'arm-01[dev]'
      - name: Run tests, studies and offline wheel checks
        run: python scripts/verify.py --output-root '${{ runner.temp }}/raftel-verification'
      - name: Retain verification evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: arm01-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/raftel-verification/
          if-no-files-found: error
          retention-days: 14
