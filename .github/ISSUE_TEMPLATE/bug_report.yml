name: Reproducible bug
description: Report a software, installation, or documentation problem.
body:
  - type: markdown
    attributes:
      value: Use the [security policy](https://github.com/LiamHoweth/RAFTEL/security/policy) for sensitive reports. Remove credentials and personal information from attachments.
  - type: input
    id: revision
    attributes:
      label: Commit and environment
      description: Include the Git revision, OS, Python version, and installation method.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command, seed, and relevant configuration or input file.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include the exit status and a short relevant excerpt or report.
    validations:
      required: true
